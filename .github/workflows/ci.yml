name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh .githooks/pre-commit
      - name: Configuration is valid JSON
        run: jq empty kohut.config.json .claude/settings.json tests/fixtures/state.json

  policy:
    name: Policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Merge gate, CI health and hygiene rules
        run: ./tests/run.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The release binary is checked against the published checksums rather
      # than trusted as downloaded.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$tarball" gitleaks
      - name: Scan the whole history
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml .
