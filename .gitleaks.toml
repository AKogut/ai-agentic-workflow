# gitleaks: the default rules plus the one secret this project actually handles.
# Discord webhook URLs live only in the gitignored .env; this rule makes sure
# none ever reaches a commit, whether through the pre-commit hook or CI.
title = "kohut"

[extend]
useDefault = true

[[rules]]
id = "discord-webhook-url"
description = "Discord webhook URL: anyone holding it can post to the channel"
regex = '''https://(?:(?:ptb|canary)\.)?discord(?:app)?\.com/api/webhooks/\d+/[\w-]+'''
keywords = ["discord"]
